<a class="card session-card {{ 'is-planned' if not s.done }}" href="{{ url_for('session_view', session_id=s.id) }}">
  <div class="row">
    <span><strong>{{ s.name }}</strong><br><span class="muted small">{{ s.day|jour }}</span></span>
    {% if s.done %}
      <span class="badge">{{ s.details.tonnage|kg }} kg</span>
    {% else %}
      <span class="status">Prévue</span>
    {% endif %}
  </div>
  {% if s.details.exercises %}
    <div class="mini">
      {% for e in s.details.exercises %}<span>{{ e.name }} <em>{{ e.done_sets|length }}/{{ e.sets|length }}</em></span>{% endfor %}
    </div>
  {% else %}
    <p class="muted small rest">Aucun exercice pour l'instant</p>
  {% endif %}
</a>
