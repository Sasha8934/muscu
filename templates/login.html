<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0e">
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="{{ url_for('manifest') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icones/apple-touch-icon.png') }}">
  <title>Connexion · Muscu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
  <main class="login">
    <img src="{{ url_for('static', filename='icones/icone-192.png') }}" alt="" width="84" height="84" class="login-logo">
    <h1>Muscu</h1>
    <p class="muted">Entre ton mot de passe pour accéder à tes séances.</p>
    {% if error %}<div class="flash error">Mot de passe incorrect.</div>{% endif %}
    <form method="post">
      <label>Mot de passe
        <input type="password" name="password" autocomplete="current-password" required autofocus>
      </label>
      <button class="btn block big">Entrer</button>
    </form>
    <p class="muted small">Tu restes connecté·e un an sur cet appareil.</p>
  </main>
</body>
</html>
